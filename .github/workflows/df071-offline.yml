name: DF-071 offline acceptance
on:
  push:
    branches: [df071-remediation-private]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    name: Reproducible source and browser checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline Python regression suite
        run: python -B RUN_OFFLINE_TESTS.py
      - name: Verify checked-in static scene is deterministic
        run: python -B scripts/df043_build_static_site.py --check
      - name: Independent browser counterfactual tests
        run: node --test tests/test_df071_counterfactual.cjs tests/test_df071_browser_contract.cjs
      - name: Clean extracted Judge Kit acceptance, no network
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile, zipfile
          with tempfile.TemporaryDirectory(prefix="df071-judge-") as tmp:
              archive = pathlib.Path(tmp) / "judge.zip"
              dest = pathlib.Path(tmp) / "extracted"
              subprocess.run([sys.executable, "-B", "judge_kit/BUILD_JUDGE_KIT.py",
                              "--output", str(archive)], check=True)
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(dest)
              subprocess.run([sys.executable, "-B", "RUN_JUDGE_CHECKS.py"],
                             cwd=dest, check=True)
              subprocess.run(["node", "--test",
                              "tests/test_df071_counterfactual.cjs",
                              "tests/test_df071_browser_contract.cjs"],
                             cwd=dest, check=True)
      - name: Build private allowlisted Judge Kit ZIP
        if: matrix.os == 'ubuntu-latest'
        shell: python
        run: |
          import os, pathlib, subprocess, sys, hashlib
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "DF071_TrueLanded_Judge_Kit_PRIVATE.zip"
          subprocess.run([sys.executable, "-B", "judge_kit/BUILD_JUDGE_KIT.py",
                          "--output", str(destination)], check=True)
          print("PRIVATE_JUDGE_KIT_SHA256=" + hashlib.sha256(destination.read_bytes()).hexdigest())
          print("PRIVATE_JUDGE_KIT_BYTES=" + str(destination.stat().st_size))
      - name: Retain private Judge Kit artifact (7 days)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: DF071-PRIVATE-Judge-Kit-${{ github.sha }}
          path: ${{ runner.temp }}/DF071_TrueLanded_Judge_Kit_PRIVATE.zip
          if-no-files-found: error
          retention-days: 7
      - name: Build and independently test DF072 safe publication candidate
        shell: python
        run: |
          import pathlib, subprocess, sys, os, tempfile, zipfile, json, hashlib
          from pathlib import PurePosixPath
          with tempfile.TemporaryDirectory(prefix="df072-safe-") as tmp:
              archive = pathlib.Path(tmp) / "competition-safe-preview.zip"
              dest = pathlib.Path(tmp) / "clean-root"
              subprocess.run([sys.executable, "-B",
                              "scripts/df072_build_release_candidate.py",
                              "--output", str(archive)], check=True)
              with zipfile.ZipFile(archive) as pack:
                  names = pack.namelist()
                  assert names and len(names) == len(set(names))
                  assert not any(x.lower().startswith(("viewer/","review/",".git/","private/"))
                                 for x in names)
                  pack.extractall(dest)
              manifest = json.loads((dest / "PREPUBLICATION_MANIFEST.json").read_text("utf8"))
              assert manifest["publication_approved"] is False
              assert manifest["history_included"] is False
              assert manifest["actual_meta_response_embedded"] is False
              assert manifest["licensed_for_publication"] is False
              assert set(manifest["files"]) == set(names)-{"PREPUBLICATION_MANIFEST.json"}
              for key,value in manifest["files"].items():
                  raw = (dest / key).read_bytes()
                  assert hashlib.sha256(raw).hexdigest() == value["sha256"]
              subprocess.run([sys.executable, "-B", "RUN_PUBLIC_TESTS.py"],
                             cwd=dest, check=True)
              subprocess.run(["node", "--test", "tests/test_df071_counterfactual.cjs",
                              "tests/test_df071_browser_contract.cjs"],
                             cwd=dest, check=True)
              print("DF072_INDEPENDENT_SAFE_PREVIEW_PASS")
      - name: Export short-lived private DF072 candidate
        if: matrix.os == 'ubuntu-latest'
        shell: python
        run: |
          import pathlib, os, subprocess, sys
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "DF072_Clean_Contest_Preview_PRIVATE.zip"
          subprocess.run([sys.executable, "-B",
                          "scripts/df072_build_release_candidate.py",
                          "--output", str(target)], check=True)
      - name: Retain DF072 private preview for owner review (7 days)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: DF072-CLEAN-PRIVATE-PREVIEW-${{ github.sha }}
          path: ${{ runner.temp }}/DF072_Clean_Contest_Preview_PRIVATE.zip
          if-no-files-found: error
          retention-days: 7
      - name: Offline release preflight (expected NO-GO)
        shell: python
        run: |
          import json, subprocess, sys
          p = subprocess.run([sys.executable, "-B", "scripts/df042_release_preflight.py"],
                             capture_output=True, text=True)
          print("release_preflight_exit_code", p.returncode)
          print("release_preflight_stdout", p.stdout[:2000])
          print("release_preflight_stderr", p.stderr[:1000])
          assert p.returncode in (0, 2), "unexpected preflight crash"
        # NO-GO is correct while rights, history, license and public submission remain gated.
